# Scratch probe, not for merging: does com.google.mlkit:genai-prompt merge INTERNET (or any other
# permission) into the app manifest? Google Maven is unreachable from the dev sandbox, so the
# answer has to come from a runner that can resolve it.
name: Probe genai-prompt manifest

on:
  push:
    branches:
      - claude/probe-genai-manifest
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Pick latest genai-prompt version
        run: |
          curl -fsSL https://dl.google.com/dl/android/maven2/com/google/mlkit/genai-prompt/maven-metadata.xml | tee metadata.xml
          v=$(sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p' metadata.xml)
          echo "Using genai-prompt $v"
          sed -i "s/GENAI_PROMPT_VERSION/$v/" gradle/libs.versions.toml
          grep genaiPrompt gradle/libs.versions.toml

      - name: Merge manifests
        run: |
          chmod +x gradlew
          ./gradlew :app:processDebugManifest :app:processReleaseManifest --no-daemon --stacktrace

      - name: Report
        run: |
          mkdir -p probe
          for v in debug release; do
            f=$(find app/build/intermediates -path "*merged_manifest*${v}*" -name AndroidManifest.xml | head -1)
            echo "===== merged manifest ($v): $f"
            cat "$f"
            cp "$f" "probe/merged-$v.xml"
            echo "===== permissions ($v)"
            grep -n -E "uses-permission|<permission" "$f" || echo "(none)"
          done
          echo "===== blame report (debug)"
          cp app/build/outputs/logs/manifest-merger-debug-report.txt probe/ || true
          grep -n -i -B1 -A3 "permission" app/build/outputs/logs/manifest-merger-debug-report.txt || true
          echo "===== per-library manifests declaring permissions"
          find ~/.gradle/caches -name "*.aar" | while read a; do
            m=$(unzip -p "$a" AndroidManifest.xml 2>/dev/null | grep -E "uses-permission|<service|<provider|<receiver|<meta-data" || true)
            if [ -n "$m" ]; then echo "--- $(basename "$a")"; echo "$m"; fi
          done | tee probe/aar-manifests.txt

      - name: Dependency tree
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon | tee probe/deps.txt | grep -E "mlkit|gms|datatransport|firebase|transport|grpc|okhttp|cronet" || true

      - name: Build debug APK (compiles with the dependency?)
        continue-on-error: true
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Fetch device-support docs
        continue-on-error: true
        run: |
          mkdir -p probe/docs
          i=0
          for u in \
            https://developers.google.com/ml-kit/genai \
            https://developers.google.com/ml-kit/genai/prompt/android \
            https://developers.google.com/ml-kit/genai/prompt/android/get-started \
            https://developer.android.com/ai/gemini-nano \
            https://developer.android.com/ai/gemini-nano/ml-kit-genai \
            https://developer.android.com/ai/gemini-nano/supported-devices; do
            i=$((i+1))
            echo "== $u"
            curl -sSL -m 30 -o "probe/docs/$i.html" -w "%{http_code} %{url_effective}\n" "$u" || true
            python3 -c "import html,re,sys; t=open(sys.argv[1],errors='ignore').read(); t=re.sub(r'(?s)<(script|style).*?</\1>','',t); t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(re.sub(r'[ \t]+',' ',t)); t=re.sub(r'\n\s*\n+','\n',t); open(sys.argv[1][:-5]+'.txt','w').write(t)" "probe/docs/$i.html" || true
            grep -i -n -E "pixel|galaxy|honor|motorola|oneplus|oppo|vivo|xiaomi|realme|poco|iqoo|supported devices|device" "probe/docs/$i.txt" | head -80 || true
          done

      # Logs and artifacts are unreachable from the dev sandbox, so the results go back onto
      # this scratch branch (pushes made with GITHUB_TOKEN do not trigger another run).
      - name: Commit results to the probe branch
        if: always()
        run: |
          cp metadata.xml probe/ || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f probe
          git commit -m "Probe results" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genai-probe
          path: probe/
