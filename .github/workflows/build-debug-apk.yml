name: Build debug APK

on:
  push:
    branches:
      - claude/android-project-setup-guide-yxalzm
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: persondic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling "latest debug build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug build (latest)
          body: Auto-built from ${{ github.sha }}. Install directly on an Android device (allow "install from unknown sources" if prompted).
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
